<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post-AGI Community</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <span class="hamburger-menu">☰</span>
        <ul>
            <li><a href="#" id="home-link">Home</a></li>
            <li><a href="#" id="forum-link">Forum</a></li>
            <li><a href="#" id="library-link">Library</a></li>
            <li><a href="#" id="events-link">Events</a></li>
        </ul>
        <div class="mobile-menu">
            <ul>
                <li><a href="#" id="home-link">Home</a></li>
                <li><a href="#" id="forum-link">Forum</a></li>
                <li><a href="#" id="library-link">Library</a></li>
                <li><a href="#" id="events-link">Events</a></li>
            </ul>
        </div>
    </nav>
    <section class="hero">
        <h1 style="letter-spacing: 0.05em; font-size: 3rem;">Welcome to the Post-AGI Community</h1>
        <h2 style="letter-spacing: 0.05em; font-size: 2rem;">Explore societal, ethical, and technological dimensions of a post-AGI world</h2>
        <button>Join the Discussion</button>
    </section>
    <section class="forum-preview">
        <h2 style="letter-spacing: 0.05em; font-size: 2rem;">Latest Discussions</h2>
        <select id="sort-threads">
            <option value="replies">Sort by Replies</option>
            <option value="tags">Sort by Tags</option>
        </select>
        <div class="thread-grid" id="threads"></div>
    </section>
    <script src="script.js"></script>
    <script>
        document.querySelector('.hamburger-menu').addEventListener('click', function() {
            document.querySelector('.mobile-menu').classList.toggle('visible');
        });
    </script>
</body>
</html>
