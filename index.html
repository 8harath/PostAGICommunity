<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post-AGI Community</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <meta name="description" content="Explore societal, ethical, and technological dimensions of a post-AGI world">
    <meta property="og:image" content="path/to/image.jpg">
</head>
<body>
    <nav>
        <ul>
            <li><a href="#" id="home-link" tabindex="0">Home</a></li>
            <li><a href="#" id="forum-link" tabindex="0">Forum</a></li>
            <li><a href="#" id="library-link" tabindex="0">Library</a></li>
            <li><a href="#" id="events-link" tabindex="0">Events</a></li>
        </ul>
        <button id="theme-toggle" tabindex="0">Toggle Dark/Light Mode</button>
    </nav>
    <section class="hero">
        <div id="node-network"></div>
        <h1 style="letter-spacing: 0.05em; font-size: 3rem;">Welcome to the Post-AGI Community</h1>
        <h2 style="letter-spacing: 0.05em; font-size: 2rem;">Explore societal, ethical, and technological dimensions of a post-AGI world</h2>
        <button tabindex="0">Join the Discussion</button>
    </section>
    <section class="forum-preview">
        <h2 style="letter-spacing: 0.05em; font-size: 2rem;">Latest Discussions</h2>
        <div id="threads"></div>
    </section>
    <button id="pause-play-toggle" tabindex="0">Pause/Play Animation</button>
    <script src="script.js"></script>
</body>
</html>
